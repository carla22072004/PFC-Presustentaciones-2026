name: Backup diario de PostgreSQL (producción)

# Corre todos los dias a las 07:00 UTC (02:00 hora Ecuador) y hace un pg_dump completo
# de la base de datos de produccion en Railway, subido como artefacto de GitHub Actions
# (retencion 90 dias, cubre de sobra los 30 dias post-defensa que exige BACKUP.md).
#
# Requiere el secret de repositorio DATABASE_URL_PUBLICA (la URL publica del proxy TCP
# del plugin Postgres de Railway -- Settings -> Networking -> TCP Proxy). No configurado
# todavia porque el sistema no esta desplegado -- este workflow queda listo para activarse
# en cuanto exista el despliegue real, ver docs/despliegue/DEPLOYMENT.md.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que el secret este configurado
        id: check
        run: |
          if [ -z "${{ secrets.DATABASE_URL_PUBLICA }}" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL_PUBLICA no esta configurado todavia -- el sistema no esta desplegado. Ver docs/despliegue/DEPLOYMENT.md."
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar cliente de PostgreSQL
        if: steps.check.outputs.configurado == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: pg_dump de la base de produccion
        if: steps.check.outputs.configurado == 'true'
        run: |
          FECHA=$(date +%Y-%m-%d)
          pg_dump "${{ secrets.DATABASE_URL_PUBLICA }}" --format=custom --file="backup-${FECHA}.dump"

      - name: Publicar el respaldo como artefacto (retencion 90 dias)
        if: steps.check.outputs.configurado == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: backup-*.dump
          retention-days: 90
