services:
  backend:
    environment:
      # RNF-15: sin esto, DemoDataSeeder (perfil "dev") no corre y AdminBootstrap (activo en
      # cualquier OTRO perfil) exige ADMIN_BOOTSTRAP_EMAIL/PASSWORD y falla al arrancar -- este
      # override es justamente lo que mantiene el stack de desarrollo local sembrando las
      # cuentas de siempre sin tocar nada del entorno de un despliegue real.
      - SPRING_PROFILES_ACTIVE=dev
  postgres:
    ports:
      - "5434:5432"
  redis:
    # Publicado para que `./mvnw test` / `make test` local (los @SpringBootTest reales)
    # alcancen el Redis del stack sin variables de entorno.
    ports:
      - "6379:6379"
  nginx:
    ports:
      - "4200:80"
