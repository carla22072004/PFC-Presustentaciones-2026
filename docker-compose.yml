services:
  # Base de Datos PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: amz-postgres
    environment:
      POSTGRES_DB: BdPresustentaciones
      POSTGRES_USER: JEAN
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U JEAN"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Caché
  redis:
    image: redis:7-alpine
    container_name: amz-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
