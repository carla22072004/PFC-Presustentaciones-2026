services:
  # Base de Datos PostgreSQL 15
  postgres:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    container_name: amz-postgres
    restart: unless-stopped
    # Fase 2 del plan de respaldos: archivado continuo de WAL para PITR (recuperación a un
    # punto en el tiempo). El wrapper crea y da permisos al directorio de archivado (un
    # volumen nombrado arranca root:root) antes de ceder el control al entrypoint oficial.
    # archive_timeout=900 -> cierra un segmento cada 15 min aunque no se llene, para que la
    # granularidad de PITR nunca supere los 15 min y el panel muestre actividad.
    command:
      - "sh"
      - "-c"
      - >
        mkdir -p /var/lib/postgresql/wal_archive &&
        chown postgres:postgres /var/lib/postgresql/wal_archive &&
        chmod 777 /var/lib/postgresql/wal_archive &&
        HBA=/var/lib/postgresql/data/pg_hba.conf;
        if [ -f "$$HBA" ] && ! grep -q 'host.*replication.*all.*all' "$$HBA"; then
          echo 'host replication all all scram-sha-256' >> "$$HBA";
        fi &&
        exec docker-entrypoint.sh postgres
        -c wal_level=replica
        -c archive_mode=on
        -c "archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f"
        -c archive_timeout=900
        -c max_wal_senders=5
    environment:
      POSTGRES_DB: BdPresustentaciones
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgresAdmin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal:/var/lib/postgresql/wal_archive
      # Scripts que corren solo al inicializar un clúster nuevo (habilitar replicación para pg_basebackup).
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Caché
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: amz-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amz-backend
    restart: unless-stopped
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://postgres:5432/BdPresustentaciones}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgresAdmin}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Sin valor por defecto a proposito: falla explicitamente si falta .env / JWT_SECRET en
      # vez de arrancar en silencio con un secreto de tutorial publico (ver application.properties).
      - "JWT_SECRET=${JWT_SECRET:?Falta JWT_SECRET -- copia .env.example a .env y genera uno real con openssl rand -hex 32}"
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
    volumes:
      # Archivos generados en tiempo de ejecucion: PDFs de actas y respaldos .dump que
      # genera el apartado "Gestion de Respaldos" del administrador. Volumen con nombre
      # para que sobrevivan a `docker compose up --build` / reinicios (se borra solo con
      # `docker compose down -v`).
      - backend_uploads:/app/uploads
      # Mismo volumen de WAL archivado que monta postgres: el panel PITR lo inspecciona
      # (contar segmentos, tamano, fecha del mas antiguo) y aplica la limpieza de WAL.
      - postgres_wal:/wal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Nginx Servidor Web y Proxy Inverso
  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: amz-nginx
    restart: unless-stopped
    ports:
      - "4200:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Frontend/dist/presustentaciones-frontend/browser:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 y no "localhost": dentro del contenedor "localhost" resuelve primero a
      # ::1 (IPv6) y nginx solo escucha en IPv4 -> el healthcheck fallaba aunque el sitio
      # respondia 200. Con 127.0.0.1 el chequeo refleja el estado real.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_uploads:
  # WAL archivado para PITR (Fase 2). Compartido entre postgres (escribe) y backend
  # (inspecciona / limpia). Se borra con `docker compose down -v`.
  postgres_wal:
