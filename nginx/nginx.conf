server {
    listen 80;
    server_name localhost;

    # Cabeceras de seguridad para el contenido estatico servido por nginx
    # (el backend ya las agrega para sus propias respuestas via Spring Security,
    # pero nginx sirve el HTML/JS/CSS del frontend directamente sin pasar por el
    # backend -- hallazgo real de un escaneo OWASP ZAP: WARN-NEW 10020/10021/10038)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # Servir archivos estáticos del Frontend Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Soporte para Angular SPA routing

        # Nota: un location con su propio add_header deja de heredar los del
        # server{} (comportamiento estandar de nginx), por eso se repiten aqui.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # index.html no debe cachearse agresivamente: referencia nombres de
        # bundle con hash que cambian en cada deploy; los bundles JS/CSS con
        # hash en el nombre si son inmutables y el navegador ya los cachea via ETag.
        add_header Cache-Control "no-cache";
    }

    # Proxy inverso para la API versionada del Backend (Requisito Nginx proxy)
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets (si se utiliza tiempo real)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy para endpoints de monitoreo Actuator
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
