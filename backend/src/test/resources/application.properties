# Configuracion exclusiva para la suite de pruebas.
# JWT_SECRET  es un valor dummy de solo-test, nunca usado en produccion
# (application.properties de main no trae default: se exige JWT_SECRET real por variable de entorno).
jwt.secret=test-only-secret-not-for-production-0123456789abcdef0123456789abcdef
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Spring Boot solo carga UN "application.properties" del classpath (no los fusiona) -- este
# archivo de test-resources tiene prioridad sobre src/main/resources/application.properties
# durante los tests, así que valores como spring.flyway.schemas=presus (definidos solo en el
# de main) nunca llegaban a un @SpringBootTest real. Hallazgo real (auditoría CI/CD 2026-08-30,
# ver PreSustentacionesApplicationTests): sin esto, Flyway usaba el esquema "public" por
# defecto para su propio historial durante los tests, en vez de "presus" (el esquema real de
# la app) -- funcionaba por casualidad contra una BD vacía (V1 crea/cualifica "presus"
# explícitamente), pero colisionaba al probar contra una BD de desarrollo ya migrada.
spring.flyway.schemas=presus
spring.jpa.properties.hibernate.default_schema=presus

# Segundo hallazgo real, más grave (verificado 2026-08-31 corriendo `make test` sin overrides
# manuales): por la misma razón de arriba, este archivo tampoco declaraba NUNCA
# spring.datasource.url/username/password ni spring.data.redis.host/port -- sin ellos, un
# @SpringBootTest no tiene ningún datasource configurado, así que Spring Boot auto-provisiona
# H2 en memoria (el driver está en el classpath para generación offline de DDL), sin importar
# @AutoConfigureTestDatabase(replace=NONE) -- esa anotación solo evita que Spring *reemplace*
# un datasource ya configurado, no crea uno de la nada. Esto también significa que el job
# `backend` de ci.yml fallaría exactamente igual: sus variables de entorno DB_URL/DB_USERNAME/
# DB_PASSWORD/REDIS_HOST/REDIS_PORT solo se interpolan vía ${DB_URL:...} en el
# application.properties de main, que nunca se carga en tests. Se replican aquí los mismos
# nombres de variable y valores por defecto que usa el de main, para que tanto `./mvnw test`
# local (sin overrides) como CI (con esas variables de entorno reales) conecten al Postgres/
# Redis real -- no a H2.
# Default local = el Postgres del stack Docker publicado en :5434 (docker-compose.override.yml),
# NO :5432 -- en Windows suele haber un PostgreSQL nativo ocupando 5432 con otra contrasena, y
# el proyecto corre 100% sobre Docker. CI sigue pasando su propio DB_URL por variable de entorno
# (job `backend` de ci.yml), que tiene prioridad sobre este default.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/BdPresustentaciones}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresAdminPassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
