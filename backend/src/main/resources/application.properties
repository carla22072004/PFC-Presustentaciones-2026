# Configuración del Servidor
server.port=${PORT:8080}

# Configuración de Base de Datos (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/presusDb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Flyway (Migraciones de BD)
spring.flyway.enabled=true
spring.flyway.schemas=presus
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Sin esto, GenerationType.AUTO genera secuencias (p.ej. estados_solicitud_seq) sin
# calificar el esquema aunque la entidad declare @Table(schema="presus"): Hibernate no
# infiere el esquema de la secuencia a partir del @Table de la entidad. La secuencia SI
# existe en Postgres (creada por V1__schema_inicial.sql dentro de "presus"), pero sin este
# default_schema el runtime la busca en el search_path por defecto y falla con "relation
# estados_solicitud_seq does not exist" -- bug real detectado creando una solicitud contra
# una base de datos recien migrada.
spring.jpa.properties.hibernate.default_schema=presus

# Configuración de Redis y Caché
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Configuración de Seguridad y JWT (Expiración: 1 hora)
# JWT_SECRET es obligatorio (sin valor por defecto): genera uno con `openssl rand -hex 32`
# y colócalo en tu .env (ver .env.example). La app no arranca sin esta variable.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator: /actuator/health es publico (SecurityConfig permitAll) para que el
# criterio P5 (Fase 8) pueda verificar el estado UP de cada componente (db, redis,
# diskSpace) sin autenticarse -- requisito explicito de la guia.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health,info
