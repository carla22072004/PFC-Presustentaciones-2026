# Configuración del Servidor
server.port=${PORT:8080}

# Configuración de Base de Datos (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/presusDb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Flyway (Migraciones de BD)
spring.flyway.enabled=true
spring.flyway.schemas=presus
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Redis y Caché
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Configuración de Seguridad y JWT (Expiración: 1 hora)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=604800000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
