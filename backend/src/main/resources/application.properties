# Configuración del Servidor
server.port=${PORT:8080}
# Confía en X-Forwarded-Proto/X-Forwarded-For del proxy inverso (nginx local, o el borde de
# Railway en producción) para que request.isSecure() detecte HTTPS correctamente detrás del
# proxy -- sin esto, la cabecera Strict-Transport-Security (HSTS, ver SecurityConfig) nunca
# se emitiría en producción porque Spring vería cada petición como HTTP plano internamente.
server.forward-headers-strategy=native

# Configuración de Base de Datos (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BdPresustentaciones}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresAdmin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Flyway (Migraciones de BD)
spring.flyway.enabled=true
spring.flyway.schemas=presus
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Sin esto, GenerationType.AUTO genera secuencias (p.ej. estados_solicitud_seq) sin
# calificar el esquema aunque la entidad declare @Table(schema="presus"): Hibernate no
# infiere el esquema de la secuencia a partir del @Table de la entidad. La secuencia SI
# existe en Postgres (creada por V1__schema_inicial.sql dentro de "presus"), pero sin este
# default_schema el runtime la busca en el search_path por defecto y falla con "relation
# estados_solicitud_seq does not exist" -- bug real detectado creando una solicitud contra
# una base de datos recien migrada.
spring.jpa.properties.hibernate.default_schema=presus

# Configuración de Redis y Caché
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Configuracion de Seguridad y JWT
# Sin valor por defecto a proposito (Requisito E14 / OWASP A02): la app debe rehusarse a
# arrancar si falta JWT_SECRET, en vez de caer de vuelta silenciosamente a un secreto de
# tutorial publicamente conocido -- hallazgo real de la auditoria 2026-08-29: el valor por
# defecto anterior aqui decodificaba (hex) a "@NcRfUjXn2r5u8x/A?D(G+KbPdSgVkYp", un secreto
# de ejemplo que aparece en tutoriales de Spring Boot + JWT, no un secreto generado para
# este proyecto.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=604800000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator: /actuator/health es publico (SecurityConfig permitAll) para que el
# criterio P5 (Fase 8) pueda verificar el estado UP de cada componente (db, redis,
# diskSpace) sin autenticarse -- requisito explicito de la guia.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health,info
